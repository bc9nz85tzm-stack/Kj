<style>
:root{
  --paper:#fafafa; --card:#ffffff; --ink:#111111; --muted:#77756d; --line:#e3e2dc;
  --most:#0a8069; --most-bg:#e2f4ee; --least:#d93a26; --least-bg:#fdebe7;
  --brand:#2540f5; --brand-bg:#e8ecff; --focus:#2540f5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.5;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.screen{display:none}.screen.on{display:block}

/* start */
.start{padding-top:8vh}
.start h1{font-size:2rem;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.start p.lead{margin:0 0 28px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
label{display:block;font-weight:700;margin:0 0 6px;font-size:.95rem}
input[type=text]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;margin-bottom:18px;font-size:1rem}
input[type=text]:focus,select:focus{border-color:var(--focus)}
select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;margin-bottom:18px;font-size:1rem;font-family:inherit;color:inherit}
.err{color:#d93a26;font-size:.9rem;min-height:1.3em;margin:-6px 0 10px}
.btn{border:0;border-radius:8px;padding:14px 20px;font-weight:700;cursor:pointer;font-size:1rem}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:disabled{background:#aab3bb;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--ink)}
.btn.ghost:disabled{border-color:#c5cbd1;color:#aab3bb;cursor:not-allowed}
.btn.block{width:100%}

/* question */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.top .num{font-size:1.4rem;font-weight:800}
.top .num small{font-size:.9rem;font-weight:500;color:var(--muted)}
.top .who{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.hint{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.head{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;padding:0 12px 6px;font-size:.85rem;font-weight:700;text-align:center}
.head .h1{color:var(--most)}.head .h2{color:var(--least)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:64px;transition:background .15s,border-color .15s}
.row .w{font-size:1.1rem;font-weight:600}
.row.pm{border-color:var(--most);background:var(--most-bg)}
.row.pl{border-color:var(--least);background:var(--least-bg)}
.pick{height:46px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:.9rem}
.pick.m.sel{background:var(--most);border-color:var(--most);color:#fff}
.pick.l.sel{background:var(--least);border-color:var(--least);color:#fff}
.pick:disabled{background:#eef0f2;color:#b7bec5;cursor:not-allowed}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:20px}

/* result */
.result h2{margin:0 0 2px;font-size:1.5rem;font-weight:800}
.result .meta{color:var(--muted);margin:0 0 18px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:14px 10px;text-align:center;border-bottom:1px solid var(--line)}
thead th{background:var(--ink);color:#fff;font-weight:700}
td.sym{font-size:1.5rem;font-weight:700;width:30%}
td.n{font-size:1.4rem;font-weight:800}
td.n.m{color:var(--most)}td.n.l{color:var(--least)}
tfoot td{font-weight:700;background:#f0f3f5;border-bottom:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}

/* result v2 */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.chip .lb{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.chip .tp{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.chip[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-selected=true] .lb{color:#c9d1d8}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin-bottom:22px}
.detail h3{margin:0 0 4px;font-size:1rem}
.detail .sub{margin:0 0 8px;color:var(--muted);font-size:.85rem}
.gwrap svg{display:block;width:100%;height:auto}
.tname{margin:14px 0 4px;font-size:1.3rem;font-weight:800}
.tname span{font-weight:500;color:var(--muted);font-size:1rem;margin-left:6px}
.detail p.d{margin:0 0 12px}
.pc{display:grid;grid-template-columns:1fr;gap:10px}
.pc h4{margin:0 0 4px;font-size:.95rem}
.pc ul{margin:0;padding-left:18px}
.pc li{margin:2px 0}
.pc .pro h4{color:var(--most)}.pc .con h4{color:var(--least)}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
h3.sec{margin:0 0 8px;font-size:1.05rem}
.legend{font-size:.8rem;color:var(--muted);margin:8px 0 0}
td.lt{font-weight:800;text-align:left;padding-left:16px;white-space:nowrap}
td.lt small{font-weight:500;color:var(--muted);margin-left:6px;font-size:1rem}
th small{display:block;font-weight:400;font-size:.7rem;opacity:.8}

.people{margin:18px 0 6px}
.people .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 8px 12px;text-align:center}
.ph{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:#efeee9;border:1.5px dashed #cfcdc5;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8c97a1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:44px;height:44px}
.pcard .kind{font-size:.78rem;color:var(--muted);font-weight:600}
.pcard .pn{font-size:1.05rem;font-weight:800;margin:2px 0 0}
.pcard .pr{font-size:.85rem;color:var(--muted)}

.fit{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.fit h4.t{margin:0 0 8px;font-size:1rem}
.fg{margin-bottom:12px}
.fg .lab{font-size:.9rem;font-weight:800;margin-bottom:6px}
.fg.good .lab{color:var(--most)}.fg.bad .lab{color:var(--least)}
.fi{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin-bottom:8px}
.fi b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:#fff;font-size:1rem}
.fg.good .fi b{background:var(--most)}.fg.bad .fi b{background:var(--least)}
.fi span{font-size:.93rem}
.tip{background:var(--brand-bg);border-radius:8px;padding:10px 12px;font-size:.9rem;margin:4px 0 14px}
.mx{width:100%;border-collapse:collapse;font-size:.9rem;text-align:center;margin-top:6px}
.mx th,.mx td{padding:8px 4px;border:1px solid var(--line);background:#fff}
.mx thead th{background:#f1f0eb;color:var(--ink)}
.mx td.g{background:var(--most-bg);color:var(--most);font-weight:800}
.mx td.b{background:var(--least-bg);color:var(--least);font-weight:800}
.mx tr.me th{background:var(--ink);color:#fff}
.mx td.cur{outline:2.5px solid var(--ink);outline-offset:-2.5px}

<body>
<div class="wrap">

<!-- 1. 시작 -->
<section id="s-start" class="screen on start">
  <div class="dk">
    <h1>숨은 업무짝꿍<br>찾기<span class="mag" aria-hidden="true">🔍</span></h1>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" autocomplete="off" placeholder="이름을 입력하세요">
    </div>
    <div class="field">
      <label for="dept">부서</label>
      <select id="dept">
        <option value="">부서를 선택하세요</option>
        <option>행정지원팀</option>
        <option>보험급여부</option>
        <option>자격징수부</option>
        <option>장기요양센터</option>
      </select>
    </div>
    <p class="note">※ 문항마다 ‘최고’ 하나, ‘최소’ 하나를 골라 주세요.</p>
    <label class="consent" id="consentBox" hidden><input type="checkbox" id="consent"> <span>내 이름, 부서, 검사 유형이 동료에게 공유되는 것에 동의해요.</span></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn go block" id="btnStart"><span>시작</span><b aria-hidden="true">↘</b></button>
  </div>
</section>

<!-- 2. 문항 -->
<section id="s-q" class="screen">
  <div class="top">
    <div class="num"><span id="qn">1</span> <small>/ 28</small></div>
    <div class="who" id="who"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <p class="hint">나를 가장 잘 나타내는 단어는 ‘최고’, 가장 거리가 먼 단어는 ‘최소’를 고르세요.</p>
  <div class="head"><span></span><span class="h1">최고</span><span class="h2">최소</span></div>
  <div class="rows" id="rows"></div>
  <div class="nav">
    <button class="btn ghost" id="btnPrev">이전</button>
    <button class="btn primary" id="btnNext">다음</button>
  </div>
</section>

<!-- 3. 결과 -->
<section id="s-r" class="screen result">
  <h2>검사 결과</h2>
  <p class="meta" id="meta"></p>
  <div class="chips" id="chips" role="tablist"></div>
  <div class="detail" id="detail"></div>
  <div class="acts">
    <button class="btn primary" id="btnShare" style="grid-column:1/-1">공유하기</button>
    <button class="btn ghost" id="btnMatch">내 짝꿍찾기</button>
    <button class="btn ghost" id="btnAgain">처음으로</button>
  </div>
</section>

</div>
<div id="matchModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <div class="sheet">
    <h3 id="mTitle">내 짝꿍 찾기</h3>
    <p class="sub" id="mSub"></p>
    <div id="mList"></div>
    <button class="btn ghost block" id="mClose">닫기</button>
  </div>
</div>
<div id="shareModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sheet">
    <h3 id="shTitle">결과 공유하기</h3>
    <p class="sub">이미지를 저장해서 카카오톡으로 보내 주세요.</p>
    <img id="shImg" alt="내 직장 유형 결과 이미지" style="width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px">
    <div class="shbtns">
      <a class="btn primary" id="shSave" download="업무짝꿍_결과.png" href="#">이미지 저장</a>
      <button class="btn ghost" id="shClose">닫기</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

function show(id){

$('btnStart').onclick = () => {
  const name = $('name').value.trim(), dept = $('dept').value.trim();
  if(!name || !dept){

  if(SHEET_URL && !$('consent').checked){ $('err').textContent = '공유 동의에 체크해 주세요.'; return; }
  $('err').textContent = '';
  person = {name, dept};

  cur = 0; render(); show('s-q');
};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnStart').click();});

function render(){
  const a = ans[cur];
  $('qn').textContent = cur+1;
  $('prog').style.width = (cur/N*100) + '%';
  const box = $('rows'); box.innerHTML = '';
  ITEMS[cur].forEach((it,i)=>{
    const row = document.createElement('div');
    row.className = 'row' + (a.m===i?' pm':'') + (a.l===i?' pl':'');
    const w = document.createElement('div'); w.className='w'; w.textContent = it[0];
    const bm = document.createElement('button');
    bm.className = 'pick m' + (a.m===i?' sel':''); bm.textContent = '최고';
    bm.disabled = (a.l===i);
    bm.setAttribute('aria-pressed', a.m===i);
    bm.setAttribute('aria-label', it[0]+' 최고');
    bm.onclick = () => { a.m = (a.m===i ? null : i); render(); };
    const bl = document.createElement('button');
    bl.className = 'pick l' + (a.l===i?' sel':''); bl.textContent = '최소';
    bl.disabled = (a.m===i);
    bl.setAttribute('aria-pressed', a.l===i);
    bl.setAttribute('aria-label', it[0]+' 최소');
    bl.onclick = () => { a.l = (a.l===i ? null : i); render(); };
    row.append(w,bm,bl); box.append(row);
  });
  $('btnPrev').disabled = (cur===0);
  const done = a.m!==null && a.l!==null;
  $('btnNext').disabled = !done;
  $('btnNext').textContent = (cur===N-1) ? '결과보기' : '다음';
}

$('btnPrev').onclick = () => { if(cur>0){cur--; render(); window.scrollTo(0,0);} };
$('btnNext').onclick = () => {

};

const MATRIX = {DD:'b',DI:'g',DS:'g',DC:'b',II:'b',IS:'g',IC:'b',SS:'b',SC:'g',CC:'g'};
function mx(a,b){ return MATRIX[a+b]||MATRIX[b+a]; }
function fitHTML(tp){
  const f=FIT[tp];
  const grp=(cls,lab,arr)=>`<div class="fg ${cls}"><div class="lab">${lab}</div>${arr.map(x=>`<div class="fi"><b>${x.t}</b><span><strong>${INFO[x.t].name}(${x.t})</strong><br>${x.why}</span></div>`).join('')}</div>`;
  const ks=['D','I','S','C'];
  const table=`<table class="mx"><thead><tr><th></th>${ks.map(k=>`<th>${k}<small>${INFO[k].name}</small></th>`).join('')}</tr></thead><tbody>`+
    ks.map(r=>`<tr class="${r===tp?'me':''}"><th>${r}<small>${INFO[r].name}</small></th>${ks.map(c=>{const v=mx(r,c);return `<td class="${v}${r===tp||c===tp?'':''}">${v==='g'?'좋음':'주의'}</td>`;}).join('')}</tr>`).join('')+`</tbody></table>`;
  return `<div class="fit"><h4 class="t">업무 궁합</h4>
    ${grp('good','합이 좋은 유형',f.good)}
    ${grp('bad','부딪히기 쉬운 유형',f.bad)}
    <div class="tip"><strong>협업 팁</strong> · ${f.tip}</div>
    <div class="fg"><div class="lab">유형 궁합표</div>${table}</div>
    <p class="note">일반적인 성향 기준의 참고 자료예요. 개인의 경험과 상황에 따라 달라질 수 있어요.</p>
  </div>`;
}

const ANIMAL={D:'🦁',I:'🐬',S:'🐻',C:'🦉'};
let resData = null, curTab = 0;

function compute(){
  const most={}, least={};
  SYMS.forEach(s=>{most[s]=0;least[s]=0;});
  ans.forEach((a,i)=>{ most[ITEMS[i][a.m][1]]++; least[ITEMS[i][a.l][2]]++; });
  const out = {most,least,graphs:[]};
  GRAPHS.forEach(g=>{
    const pts = LETTERS.map(L=>{
      const m = most[L.sym], l = least[L.sym];
      const raw = g.id==='g1' ? m : g.id==='g2' ? l : m-l;
      const v   = g.id==='g2' ? -l : raw;
      return {k:L.k, raw, lv:level(g.id,L.k,v), tie:v};
    });
    const order = pts.map((p,i)=>({...p,i})).sort((x,y)=> y.lv-x.lv || y.tie-x.tie || x.i-y.i);
    const tied = order[0].lv===order[1].lv && order[0].tie===order[1].tie;
    out.graphs.push({pts, type: order[0].k, tied});
  });
  return out;
}

function svgGraph(pts,color){
  const W=340, ml=34, mr=10, mt=34, rh=30, H=mt+rh*7+16;
  const cw=(W-ml-mr)/4;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="DISC 그래프">`;
  // 수준 4 음영
  g+=`<rect x="${ml}" y="${mt+rh*3}" width="${W-ml-mr}" height="${rh}" fill="#edf0ff"/>`;
  for(let l=7;l>=1;l--){
    const y=mt+(7-l)*rh;
    g+=`<text x="${ml-10}" y="${y+rh/2+4}" text-anchor="end" font-size="12" fill="#77756d">${l}</text>`;
    g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#cfcdc5" stroke-dasharray="4 3"/>`;
  }
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+rh*7}" y2="${mt+rh*7}" stroke="#111111" stroke-width="2"/>`;
  g+=`<line x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+rh*7}" stroke="#111111" stroke-width="2"/>`;
  const xy = pts.map((p,i)=>[ml+cw*(i+.5), mt+(7-p.lv)*rh+rh/2]);
  pts.forEach((p,i)=>{
    const x=xy[i][0];
    g+=`<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt+rh*7}" stroke="#e3e2dc"/>`;
    g+=`<text x="${x}" y="22" text-anchor="middle" font-size="16" font-weight="800" fill="#111111">${p.k}</text>`;
  });
  g+=`<polyline points="${xy.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    const [x,y]=xy[i];
    g+=`<circle cx="${x}" cy="${y}" r="6.5" fill="${color}" stroke="#fff" stroke-width="2.5"/>`;
    const above = p.lv<7;
    g+=`<text x="${x+9}" y="${y+(above?-8:14)}" font-size="11" fill="#111111" font-weight="700">${p.raw>0&&GRAPHS[curTab].id==='g3'?'+':''}${p.raw}</text>`;
  });
  return g+'</svg>';
}

function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const em=['🎉','✨','⭐','💖','🍀','🎈'];
  for(let i=0;i<22;i++){
    const e=document.createElement('span'); e.className='confetti';
    e.textContent=em[i%em.length]; e.style.left=(Math.random()*96)+'vw';
    e.style.animationDelay=(Math.random()*0.8)+'s'; e.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    document.body.appendChild(e); setTimeout(()=>e.remove(),3600);
  }
}

// ===== 구글 시트 연결 설정 =====
// Apps Script 웹 앱 주소와 비밀번호를 넣으면 결과가 자동으로 모여요. 비워두면 이 기기 안에서만 동작해요.
let SHEET_URL = 'https://script.google.com/macros/s/AKfycbzPVIF8GLAYynldFIyII4UgJF-bF-561W47SZdORGrv5GqNgXu4GHwQhkt0KrtxpWX_Jw/exec';
let SHEET_KEY = 'nhiskj';
if(SHEET_URL) $('consentBox').hidden = false;

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function sendResult(){
  if(!SHEET_URL || !resData) return;
  const order=['Z','□','▲','★','N'];
  const body={key:SHEET_KEY,name:person.name,dept:person.dept,
    work:resData.graphs[0].type,daily:resData.graphs[1].type,want:resData.graphs[2].type,
    most:order.map(k=>resData.most[k]),least:order.map(k=>resData.least[k])};
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(body)})
    .then(()=>toast('내 결과를 동료들과 공유했어요'))
    .catch(()=>toast('결과를 저장하지 못했어요. 인터넷 연결을 확인해 주세요.'));
}
async function loadRoster(){
  const seeds = ROSTER.map(r=>({...r}));
  if(!SHEET_URL) return {list:seeds, ok:true};
  try{
    const res = await fetch(SHEET_URL+'?key='+encodeURIComponent(SHEET_KEY));
    const j = await res.json();
    if(!j.ok) throw new Error('key');
    const list = seeds.slice();
    j.people.forEach(p=>{
      if(!'DISC'.includes(p.type) || !p.type) return;
      const i = list.findIndex(r=>r.name===p.name);
      if(i>=0){ list[i].type=p.type; if(!list[i].dept) list[i].dept=p.dept; }
      else list.push({name:p.name,role:'',dept:p.dept,type:p.type});
    });
    return {list, ok:true};
  }catch(e){ return {list:seeds, ok:false}; }
}

// ===== 공유하기: 직장 유형 결과를 이미지 카드로 만들어 공유 =====
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrapWords(ctx,text,x,y,maxW,lh){
  let line='';
  text.split(' ').forEach(w=>{
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW && line){ctx.fillText(line,x,y);y+=lh;line=w;} else line=t;
  });
  if(line){ctx.fillText(line,x,y);y+=lh;}
  return y;
}
function makeCard(){
  const gs=resData.graphs, main=gs[0], tp=main.type, info=INFO[tp];
  const W=1080, CX=60, CW=960, PX=116, PW=848;
  const c=document.createElement('canvas'); c.width=W; c.height=2600;
  const g=c.getContext('2d'); g.textBaseline='alphabetic';
  // 헤더
  g.textAlign='left'; g.fillStyle='#111'; g.font='800 36px '+FONT; g.fillText('숨은 업무짝꿍 찾기🔍',PX,150);
  g.textAlign='right'; g.fillStyle='#77756d'; g.font='500 30px '+FONT; g.fillText(person.dept+' · '+person.name,PX+PW,150);
  g.fillStyle='#e3e2dc'; g.fillRect(PX,186,PW,2);
  // 세 가지 결과 나란히
  const labels=['직장','일상','추구미'], colors=['#0b8a73','#d93a26','#2540f5'];
  const colW=270, gap=(PW-colW*3)/2, y0=236, colH=452;
  gs.forEach((gr,i)=>{
    const x0=PX+i*(colW+gap), isMain=i===0, t=gr.type, cx=x0+colW/2;
    g.fillStyle=isMain?'#e8ecff':'#f7f7f4'; rr(g,x0,y0,colW,colH,28); g.fill();
    if(isMain){ g.strokeStyle='#2540f5'; g.lineWidth=4; rr(g,x0+2,y0+2,colW-4,colH-4,26); g.stroke(); }
    g.textAlign='center';
    g.fillStyle=isMain?'#2540f5':'#77756d'; g.font='700 30px '+FONT; g.fillText(labels[i],cx,y0+58);
    g.fillStyle='#111'; g.font='84px '+FONT; g.fillText(ANIMAL[t],cx,y0+158);
    g.font='800 46px '+FONT; g.fillText(t+'유형',cx,y0+226);
    g.fillStyle=isMain?'#2540f5':'#77756d'; g.font='600 28px '+FONT; g.fillText(INFO[t].name,cx,y0+268);
    // 미니 그래프
    const gx=x0+36, gw=colW-72, gy=y0+298, rh=14, cw=gw/4, base=gy+rh*7;
    g.strokeStyle='#cfcdc5'; g.lineWidth=2; g.beginPath(); g.moveTo(gx,base+8); g.lineTo(gx+gw,base+8); g.stroke();
    const pts=gr.pts.map((p,k)=>({x:gx+cw*(k+.5),y:gy+(7-p.lv)*rh+rh/2,p}));
    g.strokeStyle=colors[i]; g.lineWidth=4; g.lineJoin='round'; g.beginPath();
    pts.forEach((q,k)=>k?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)); g.stroke();
    pts.forEach(q=>{
      const m=q.p.k===t;
      g.fillStyle=m?colors[i]:'#fff'; g.strokeStyle=colors[i]; g.lineWidth=3;
      g.beginPath(); g.arc(q.x,q.y,m?8:5,0,Math.PI*2); g.fill(); g.stroke();
      g.fillStyle=m?colors[i]:'#77756d'; g.font=(m?'800 24px ':'600 22px ')+FONT; g.fillText(q.p.k,q.x,base+42);
    });
  });
  // 설명: 직장 유형만
  let y=y0+colH+84;
  g.textAlign='left'; g.fillStyle='#77756d'; g.font='600 28px '+FONT; g.fillText('직장 유형 설명',PX,y);
  y+=76; g.fillStyle='#111'; g.font='800 60px '+FONT; const tw=g.measureText(tp+'유형').width; g.fillText(tp+'유형',PX,y);
  g.font='700 32px '+FONT; const nw=g.measureText(info.name).width+48;
  g.fillStyle='#2540f5'; rr(g,PX+tw+22,y-46,nw,54,27); g.fill();
  g.fillStyle='#fff'; g.fillText(info.name,PX+tw+22+24,y-8);
  g.fillStyle='#2b2a26'; g.font='500 34px '+FONT;
  y=wrapWords(g,info.d,PX,y+68,PW,56);
  y+=34; let x=PX; g.font='700 29px '+FONT;
  info.keys.forEach(k=>{
    const w=g.measureText(k).width+44;
    if(x+w>PX+PW){x=PX;y+=68;}
    g.fillStyle='#e8ecff'; rr(g,x,y-38,w,54,27); g.fill();
    g.fillStyle='#2540f5'; g.fillText(k,x+22,y);
    x+=w+12;
  });
  y+=58;
  g.fillStyle='#f4f6ff'; rr(g,PX,y,PW,150,28); g.fill();
  g.fillStyle='#77756d'; g.font='600 28px '+FONT; g.fillText('잘 맞는 유형',PX+36,y+54);
  g.fillStyle='#111'; g.font='800 38px '+FONT;
  g.fillText(FIT[tp].good.map(t=>INFO[t.t].name+'('+t.t+')').join('   ·   '),PX+36,y+112);
  const cardH=y+150+56-60;
  const out=document.createElement('canvas'); out.width=W; out.height=cardH+120;
  const o=out.getContext('2d'); o.fillStyle='#f1f0eb'; o.fillRect(0,0,W,out.height);
  o.fillStyle='#fff'; rr(o,CX,60,CW,cardH,40); o.fill(); o.strokeStyle='#e3e2dc'; o.lineWidth=2; o.stroke();
  o.drawImage(c,0,0);
  return out;
}

function legacyCopy(txt){
  return new Promise((res,rej)=>{
    const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; ta.style.top='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok=false; try{ok=document.execCommand('copy');}catch(e){}
    ta.remove(); ok?res():rej();
  });
}
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt).catch(()=>legacyCopy(txt));
  return legacyCopy(txt);
}
function cardBlob(){
  return new Promise(res=>makeCard().toBlob(res,'image/png'));
}
async function doShare(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  const blob = await cardBlob();
  const file = new File([blob],'업무짝꿍_결과.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  $('shImg').src = url; $('shSave').href = url;
  $('shareModal').hidden = false;
}
$('btnShare').onclick = doShare;
